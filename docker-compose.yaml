version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: soc_db
    ports:
      - "5432:5432"

  soc_app:
    build: .
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/soc_db
    ports:
      - "5000:5000"
    depends_on:
      - db
