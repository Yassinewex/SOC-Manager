<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>SOC Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f5; padding: 20px; }
        .header { background: #1a252f; color: white; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; }
        .grid { display: flex; gap: 20px; margin-top: 20px; }
        .card { flex: 1; background: white; padding: 20px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .value { font-size: 2.5em; font-weight: bold; color: #e74c3c; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🛡️ SOC Manager - Dashboard</h1>
        <span id="status">Chargement...</span>
    </div>
    <div class="grid">
        <div class="card">
            <h3>Incidents Ouverts</h3>
            <div class="value" id="incidents-count">--</div>
        </div>
        <div class="card">
            <h3>Alertes Totales</h3>
            <div class="value" id="alerts-count">--</div>
        </div>
        <div class="card">
            <h3>CPU Serveur</h3>
            <div class="value" id="cpu-usage">--%</div>
        </div>
    </div>
    <script>
        async function update() {
            const res = await fetch('/api/dashboard/metrics');
            const data = await res.json();
            let totalAlerts = Object.values(data.alerts).reduce((a, b) => a + b, 0);
            document.getElementById('incidents-count').innerText = data.open_incidents;
            document.getElementById('alerts-count').innerText = totalAlerts;

            const healthRes = await fetch('/api/dashboard/health');
            const health = await healthRes.json();
            document.getElementById('cpu-usage').innerText = health.cpu_usage + "%";
            document.getElementById('status').innerText = "🟢 Opérationnel";
        }
        update();
        setInterval(update, 10000);
    </script>
</body>
</html>
